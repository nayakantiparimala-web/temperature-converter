<!DOCTYPE html>
<html>
<head>
    <title>Temperature Converter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            width: 350px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Temperature Converter</h1>

        <input type="number" id="temp" placeholder="Enter temperature">

        <select id="type">
            <option value="cToF">Celsius to Fahrenheit</option>
            <option value="fToC">Fahrenheit to Celsius</option>
        </select>

        <br>

        <button onclick="convertTemperature()">Convert</button>

        <div id="result"></div>
    </div>

    <script>
        function convertTemperature() {

            let temp = Number(document.getElementById("temp").value);
            let type = document.getElementById("type").value;
            let result;

            if (type === "cToF") {
                result = (temp * 9 / 5) + 32;
                document.getElementById("result").innerText =
                    "Fahrenheit: " + result.toFixed(2) + " °F";
            } else {
                result = (temp - 32) * 5 / 9;
                document.getElementById("result").innerText =
                    "Celsius: " + result.toFixed(2) + " °C";
            }
        }
    </script>

</body>
</html>
